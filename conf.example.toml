# Example AutoHDR-VK configuration
# Copy to ~/.config/autohdr-vk/conf.toml

[global]
# Primary look control (Windows AutoHDR-style). 0 = near-SDR, 1 = full peak.
intensity = 0.5

# Saturation / chroma strength (0 = luma-only + no gamut expand, 1 = full). Overlay "Color" slider.
# Also scales gamut_expansion (see advanced overrides).
color_intensity = 0.33

# Shadow→highlight expansion shape (0 = linear, 1 = exponential). Overlay "Shape" slider.
expansion_shape = 0.55

# Advanced overrides (optional; kept for back-compat)
# reference_nits = 203
# peak_nits = 1000
# black_point = 0.0
# gamut_expansion = 1.0   # max expand scale when color_intensity = 1
# highlight_softness = 0.30
# perceptual_color = true
# tone_curve_preset = "balanced"
# dither = true            # bit-depth dither before swapchain quantize (reduces banding)
# dither_strength = 1.0    # 1 = one LSB of output depth (8/10/16)

# auto | pq | scrgb | sdr_preview
encoding = "auto"
set_hdr_metadata = true
prefer_hdr_swapchain = true
enabled = true

# Optional per-executable overrides (basename match, case-insensitive)
# [[profile]]
# exe = "eldenring.exe"
# enabled = true
# intensity = 0.7
